apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: voyago
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 729231827726.dkr.ecr.us-east-2.amazonaws.com/dev/voyago:backend-<FULL_SHA>
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: AGENT_URL
              value: http://agent:8000
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: voyago-secrets
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: voyago-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voyago-secrets
                  key: DB_PASSWORD
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: voyago-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voyago-secrets
                  key: GITHUB_CLIENT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: voyago-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voyago-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: voyago-secrets
                  key: FRONTEND_URL
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: voyago-secrets
                  key: CORS_ALLOWED_ORIGINS
            - name: COOKIE_SECURE
              valueFrom:
                secretKeyRef:
                  name: voyago-secrets
                  key: COOKIE_SECURE
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 50
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: voyago
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080